# Blueprint de Render: crea el servicio web y pide las variables necesarias.
# Los valores marcados con "sync: false" se completan al crear el Blueprint.
services:
  - type: web
    name: rastro-app
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_BUCKET
        value: fotos
      # Obligatoria: se usa para armar el enlace de "recuperar contraseña".
      # Sin ella el servidor se niega a generar el enlace (evita que un
      # tercero lo desvíe a su propio dominio falseando la cabecera Host).
      # Ponla con la URL real: https://tu-app.onrender.com
      - key: APP_URL
        sync: false
      # Deja TRUST_PROXY=1 SOLO si tu proxy reescribe la cabecera
      # X-Forwarded-For. Si tu app queda expuesta sin proxy, déjalo en 0:
      # así los límites de peticiones usan la IP real de la conexión y no se
      # pueden falsear con cabeceras.
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:contacto@example.com
      # Correos con permiso para el panel de administración, separados por coma.
      - key: ADMIN_EMAILS
        sync: false
