// Módulo Android de PetSeñal (Trusted Web Activity).
// Los valores de la TWA se centralizan en `twaManifest` y se vuelcan a recursos
// (colores, strings, bools, shortcuts) igual que hace Bubblewrap, para no repetir
// datos entre el manifiesto y Gradle.
import groovy.xml.MarkupBuilder

apply plugin: 'com.android.application'

def twaManifest = [
    applicationId: 'com.petsenal.app',
    hostName: 'petsenal.com',
    launchUrl: '/',
    name: 'PetSeñal - Mascotas perdidas y encontradas',
    launcherName: 'PetSeñal',
    themeColor: '#F5F2EB',
    themeColorDark: '#000000',
    navigationColor: '#000000',
    navigationColorDark: '#000000',
    navigationDividerColor: '#000000',
    navigationDividerColorDark: '#000000',
    backgroundColor: '#F5F2EB',
    enableNotifications: true,
    shortcuts: [
        [name: 'Encontré un animal', short_name: 'Encontré', url: 'https://petsenal.com/?tab=found', icon: 'shortcut_icon'],
        [name: 'Perdí a mi mascota', short_name: 'Perdí', url: 'https://petsenal.com/?tab=lost', icon: 'shortcut_icon'],
        [name: 'Chats', short_name: 'Chats', url: 'https://petsenal.com/?tab=chats', icon: 'shortcut_icon'],
    ],
    splashScreenFadeOutDuration: 300,
    generatorApp: 'bubblewrap-cli',
    fallbackType: 'customtabs',
    enableSiteSettingsShortcut: 'true',
    orientation: 'portrait',
]

android {
    compileSdk 36
    buildToolsVersion '35.0.0'
    namespace 'com.petsenal.app'

    defaultConfig {
        applicationId 'com.petsenal.app'
        minSdk 21
        targetSdk 36
        versionCode 2
        versionName '2'

        resValue 'string', 'appName', twaManifest.name
        resValue 'string', 'launcherName', twaManifest.launcherName

        def launchUrl = 'https://' + twaManifest.hostName + twaManifest.launchUrl
        resValue 'string', 'launchUrl', launchUrl
        resValue 'string', 'webManifestUrl', 'https://' + twaManifest.hostName + '/manifest.json'
        resValue 'string', 'fullScopeUrl', 'https://' + twaManifest.hostName + '/'
        resValue 'string', 'hostName', twaManifest.hostName

        resValue 'color', 'colorPrimary', twaManifest.themeColor
        resValue 'color', 'colorPrimaryDark', twaManifest.themeColorDark
        resValue 'color', 'navigationColor', twaManifest.navigationColor
        resValue 'color', 'navigationColorDark', twaManifest.navigationColorDark
        resValue 'color', 'navigationDividerColor', twaManifest.navigationDividerColor
        resValue 'color', 'navigationDividerColorDark', twaManifest.navigationDividerColorDark
        resValue 'color', 'backgroundColor', twaManifest.backgroundColor

        resValue 'string', 'providerAuthority', twaManifest.applicationId + '.fileprovider'
        resValue 'bool', 'enableNotification', twaManifest.enableNotifications.toString()

        twaManifest.shortcuts.eachWithIndex { shortcut, index ->
            resValue 'string', "shortcut_name_$index", "$shortcut.name"
            resValue 'string', "shortcut_short_name_$index", "$shortcut.short_name"
        }

        resValue 'integer', 'splashScreenFadeOutDuration', twaManifest.splashScreenFadeOutDuration.toString()
        resValue 'string', 'generatorApp', twaManifest.generatorApp
        resValue 'string', 'fallbackType', twaManifest.fallbackType
        resValue 'bool', 'enableSiteSettingsShortcut', twaManifest.enableSiteSettingsShortcut
        resValue 'string', 'orientation', twaManifest.orientation
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// Genera res/xml/shortcuts.xml a partir de twaManifest, igual que Bubblewrap.
tasks.register('generateShortcutsFile') {
    assert twaManifest.shortcuts.size() < 5, 'Se permiten como máximo 4 accesos directos.'
    twaManifest.shortcuts.eachWithIndex { s, i ->
        assert s.name != null, 'Falta `name` en el acceso directo #' + i
        assert s.short_name != null, 'Falta `short_name` en el acceso directo #' + i
        assert s.url != null, 'Falta `url` en el acceso directo #' + i
        assert s.icon != null, 'Falta `icon` en el acceso directo #' + i
    }

    def shortcutsFile = layout.projectDirectory.file('src/main/res/xml/shortcuts.xml').asFile
    def shortcuts = twaManifest.shortcuts
    def appId = twaManifest.applicationId
    outputs.file(shortcutsFile)

    doLast {
        def xmlWriter = new StringWriter()
        def xmlMarkup = new MarkupBuilder(new IndentPrinter(xmlWriter, "    ", true))

        xmlMarkup.'shortcuts'('xmlns:android': 'http://schemas.android.com/apk/res/android') {
            shortcuts.eachWithIndex { s, i ->
                'shortcut'(
                    'android:shortcutId': 'shortcut' + i,
                    'android:enabled': 'true',
                    'android:icon': '@drawable/' + s.icon,
                    'android:shortcutShortLabel': '@string/shortcut_short_name_' + i,
                    'android:shortcutLongLabel': '@string/shortcut_name_' + i) {
                    'intent'(
                        'android:action': 'android.intent.action.MAIN',
                        'android:targetPackage': appId,
                        'android:targetClass': appId + '.LauncherActivity',
                        'android:data': s.url)
                    'categories'('android:name': 'android.intent.category.LAUNCHER')
                }
            }
        }
        shortcutsFile.text = xmlWriter.toString() + '\n'
    }
}

tasks.named('preBuild') {
    dependsOn 'generateShortcutsFile'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
    implementation 'com.google.androidbrowserhelper:locationdelegation:1.1.2'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
}
